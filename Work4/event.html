<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <button>Check</button>
        <script>
            const btn = document.querySelector("button")
            btn.addEventListener("click", function() {
                alert("Bye")
            })
            btn.addEventListener("mouseover", () => {
                btn.style.backgroundColor="red"
            })
            btn.addEventListener("mouseout", () => {
                btn.style.backgroundColor=""
            })
        </script>
    </body>
</html>
