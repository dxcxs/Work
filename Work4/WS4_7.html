<html>
    <head>
        
    </head>
    <body>
        <h1>Shopping Cart</h1>
        <button>Latte</button>
        <button>Espresso</button>
        <button>Americano</button>
        <button>Cappuccino</button>

        <h1>Items in Cart</h1>
        <ul id="taskList"></ul>
        <h2>Total: <span id="total">0</span></h2>
        
        <script>
            const ul = document.querySelector("ul")

            document.querySelectorAll("button").forEach(btn => {
                btn.addEventListener("click", () => {
                    let li = document.createElement("li")
                    li.innerHTML = `${btn.textContent} <button id="X1">-</button><button id="X2">+</button>`
                    
                    li.querySelector("#X1").addEventListener("click", () => {
                        li.remove()
                    })

                    li.querySelector("#X2").addEventListener("click", () => {
                        li.remove()
                    })

                    ul.appendChild(li)
                })
            })
        </script> 
    </body> 
</html>
