<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Display</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f1f5f3; display: flex; justify-content: center; padding: 40px; }
    .card { background: #fff; padding: 24px 32px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.1); min-width: 280px; }
    h2 { margin-top: 0; color: #0b5d3b; }
    .in { color: #1e9e4a; font-weight: 600; }
    .out { color: #d93025; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card" id="productInfo"></div>
  <script src="script.js"></script>
</body>
</html>
